<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Log In - Bemu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

  <label>Email</label>
  <input id="email" type="email" placeholder="you@example.com" required />

  <label>Password</label>
  <input id="password" type="password" placeholder="Enter your password" required />

<body>
  <header class="top-header">
    <div class="logo">
      <a href="index.html" class="logo-link">Bemu</a>
    </div>

    <div class="search-bar">
      <input type="text" placeholder="Search for products..." />
      <button>Search</button>
    </div>

    <div class="header-links">
      <a href="#">Orders</a>
      <a href="#">Cart</a>
      <!-- just a link to this page, NOT a form -->
      <a href="login.html" class="login-btn">Log In</a>
    </div>
  </header>

  <nav class="sub-header">
    <a href="index.html">Back to Home</a>
  </nav>

  <main class="login-main">
  <section class="login-container">
    <div class="login-card">
      <h1>Sign-In</h1>

      <form id="loginForm" class="login-form">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          required
        />

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="Enter your password"
          required
        />

        <button type="submit" class="login-submit-btn">Log In</button>
      </form>

      <div class="login-divider">
        <span>or</span>
      </div>

      <!-- ✅ Google sign-in button -->
      <div class="google-login-wrapper">
        <button
          type="button"
          id="google-signin-btn"
          class="google-login-btn"
        >
          <img
            src="https://developers.google.com/identity/images/g-logo.png"
            alt=""
            class="google-logo"
          />
          <span>Sign in with Google</span>
        </button>
      </div>

      <p class="login-helper-text">
        New to Bemu Storefront?
        <a href="register.html">Create your Bemu account</a>
      </p>
    </div>
  </section>
</main>

  <footer>
    <p>&copy; 2025 Bemu. All rights reserved.</p>
  </footer>

<script>
document.addEventListener('DOMContentLoaded', function () {
  // ---------- NORMAL EMAIL/PASSWORD LOGIN ----------
  const loginForm = document.querySelector('.login-form');

  if (loginForm) {
    loginForm.addEventListener('submit', async function (e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const response = await fetch('http://192.168.10.12:3000/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          alert(data.message || 'Login failed');
          return;
        }

        // Save user info (used by index.html and owner-dashboard.html)
        const user = {
          email: data.email,
          role: data.role,
          isOwner: data.isOwner === true
        };
        localStorage.setItem('bemuUser', JSON.stringify(user));

        // Redirect based on role
        if (user.isOwner) {
          window.location.href = 'owner-dashboard.html';
        } else {
          window.location.href = 'index.html';
        }
      } catch (err) {
        console.error('Error connecting to server:', err);
        alert('Error connecting to server.');
      }
    });
  }

  // ---------- GOOGLE SIGN-IN BUTTON ----------
  const googleBtn = document.getElementById('google-signin-btn');

  if (googleBtn) {
    googleBtn.addEventListener('click', function () {
      // This MUST match the route you added in server.js
      // and that route should redirect to Google.
      window.location.href = 'http://192.168.10.12:3000/api/auth/google';
    });
  }

  // ---------- HANDLE GOOGLE CALLBACK (code in URL) ----------
  const params = new URLSearchParams(window.location.search);
  const authCode = params.get('code');

  if (authCode) {
    (async () => {
      try {
        const response = await fetch(
          'http://192.168.10.12:3000/api/auth/google/callback?code=' + encodeURIComponent(authCode),
          { method: 'GET' }
        );

        const data = await response.json();

        if (!response.ok) {
          console.error('Google login error:', data);
          alert(data.message || 'Error signing in with Google.');
          return;
        }

        // Save user info from Google sign-in
        const user = {
          email: data.email,
          role: data.role,
          isOwner: data.isOwner === true
        };
        localStorage.setItem('bemuUser', JSON.stringify(user));

        // Clean the ?code=... out of the URL
        window.history.replaceState({}, document.title, 'login.html');

        // Redirect based on role
        if (user.isOwner) {
          window.location.href = 'owner-dashboard.html';
        } else {
          window.location.href = 'index.html';
        }
      } catch (err) {
        console.error('Error during Google login callback:', err);
        alert('Error signing in with Google.');
      }
    })();
  }
});
</script>
</body>
</html>
