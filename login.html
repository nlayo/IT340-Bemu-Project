<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Log In - Bemu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <header class="top-header">
    <div class="logo">
      <a href="index.html" class="logo-link">Bemu</a>
    </div>

    <div class="search-bar">
      <input type="text" placeholder="Search for products..." />
      <button>Search</button>
    </div>

    <div class="header-links">
      <a href="#">Orders</a>
      <a href="#">Cart</a>
      <!-- just a link to this page, NOT a form -->
      <a href="login.html" class="login-btn">Log In</a>
    </div>
  </header>

  <nav class="sub-header">
    <a href="index.html">Back to Home</a>
  </nav>

  <main class="login-main">
  <section class="login-container">
    <div class="login-card">
      <h1>Sign-In</h1>

      <form id="login-form" class="login-form">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          required
        />

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="Enter your password"
          required
        />

        <button type="submit" class="login-submit-btn">Log In</button>
      </form>

      <div class="login-divider">
        <span>or</span>
      </div>

      <!-- ✅ Google sign-in button -->
      <div class="google-login-wrapper">
        <button
          type="button"
          id="google-signin-btn"
          class="google-login-btn"
        >
          <img
            src="https://developers.google.com/identity/images/g-logo.png"
            alt=""
            class="google-logo"
          />
          <span>Sign in with Google</span>
        </button>
      </div>

      <p class="login-helper-text">
        New to Bemu Storefront?
        <a href="register.html">Create your Bemu account</a>
      </p>
    </div>
  </section>
</main>

  <footer>
    <p>&copy; 2025 Bemu. All rights reserved.</p>
  </footer>

<script>
  // -------- EMAIL/PASSWORD LOGIN --------
  document.addEventListener('DOMContentLoaded', function () {
    const loginForm = document.querySelector('#login-form');

    if (!loginForm) return;

    loginForm.addEventListener('submit', async function (e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        alert('Please enter email and password.');
        return;
      }

      try {
        const response = await fetch('http://192.168.10.12:3000/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          alert(data.message || 'Login failed');
          return;
        }

        // Save user in localStorage for ALL pages
        const user = {
          email: data.email,
          role: data.role,
          isOwner: data.isOwner === true
        };

        localStorage.setItem('bemuUser', JSON.stringify(user));

        // Redirect based on role
        if (user.isOwner) {
          window.location.href = 'owner-dashboard.html';
        } else {
          window.location.href = 'index.html';
        }
      } catch (err) {
        console.error(err);
        alert('Error connecting to server.');
      }
    });
  });

  // -------- GOOGLE SIGN-IN LOGIN --------

  // 1) Handle the ID token from Google and send it to your backend
  window.handleCredentialResponse = async function (response) {
    try {
      const idToken = response.credential;

      const apiRes = await fetch('http://192.168.10.12:3000/api/google-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ credential: idToken })
      });

      const data = await apiRes.json();

      if (!apiRes.ok) {
        alert(data.message || 'Google login failed');
        return;
      }

      // Same shape as normal login response
      const user = {
        email: data.email,
        role: data.role,
        isOwner: data.isOwner === true
      };

      localStorage.setItem('bemuUser', JSON.stringify(user));

      if (user.isOwner) {
        window.location.href = 'owner-dashboard.html';
      } else {
        window.location.href = 'index.html';
      }
    } catch (err) {
      console.error('Google login error:', err);
      alert('Error signing in with Google.');
    }
  };

  // 2) Initialize the Google button when the page finishes loading
  window.addEventListener('load', function () {
    // Replace this with your real client ID:
    const CLIENT_ID = '36943721942-urkobha93977rehviocjurp4h3fckqk6.apps.googleusercontent.com';

    if (!(window.google && google.accounts && google.accounts.id)) {
      console.error('Google Identity script not loaded.');
      return;
    }

    google.accounts.id.initialize({
  client_id: CLIENT_ID,
  callback: async (response) => {
    try {
      const res = await fetch('http://192.168.10.12:3000/api/login/google', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ credential: response.credential }),
});

    const btnContainer = document.getElementById('g_id_signin');
    if (btnContainer) {
      google.accounts.id.renderButton(btnContainer, {
        theme: 'outline',
        size: 'large',
        width: 320
      });
    }

    // Optional: show One Tap UI
    // google.accounts.id.prompt();
  });
</script>
</body>
</html>
