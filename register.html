<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Your Bemu Account</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="logo">Bemu</div>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="login.html">Log in</a>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <h1>Create your Bemu account</h1>
      <p>Join Bemu to save your favorites, track orders, and more.</p>

      <form class="auth-form">
        <label>
          Full name
          <input type="text" name="fullname" required />
        </label>

        <label>
          Email
          <input type="email" name="email" required />
        </label>

        <label>
          Password
          <input type="password" name="password" required />
        </label>

        <label>
          Confirm password
          <input type="password" name="confirmPassword" required />
        </label>

        <button type="submit" class="primary-btn">
          Create account
        </button>
      </form>

      <p class="auth-switch">
        Already have a Bemu account?
        <a href="login.html">Log in instead</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 Bemu. All rights reserved.</p>
  </footer>

  <script>
    const form = document.querySelector('.auth-form');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    
    const email = form.email.value.trim();
    const password = form.password.value;
    const confirmPassword = form.confirmPassword.value;

    if (password !== confirmPassword) {
      alert('Passwords do not match');
      return;
    }

    try {
      const response = await fetch('http://192.168.10.12:3000/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();

      if (!response.ok) {
        alert(data.message || 'Registration failed');
        return;
      }

      alert('Account created! You can now log in.');
      window.location.href = 'login.html';
    } catch (err) {
      console.error(err);
      alert('Error connecting to server.');
    }
  });
  </script>
</body>
</html>
